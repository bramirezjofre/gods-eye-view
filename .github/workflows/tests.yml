# GitHub Actions CI for gods-eye-view (dockerized fork)
#
# Why this exists:
#   The upstream gods-eye-view ships its own test harness at
#   scripts/run-unit-tests.mjs, which uses `node --test` with the
#   default concurrency. That hangs in Node 24.x because some tests
#   spawn workers (puppeteer-core, Overpass disk-cache probes, etc.)
#   that leave promises pending at process exit — Node's --test
#   runner treats that as a hang when concurrency > 1.
#
#   We don't fix the upstream harness here (out of scope for the
#   dockerization), but we do run the tests in CI with
#   `--test-concurrency=1`, which serializes them and avoids the
#   promise-pending deadlock. It's slower (~10 min for the full
#   suite) but reliable.
#
# What this workflow verifies on every PR/push to main:
#   1. npm ci completes (deps resolve cleanly)
#   2. vite build completes (the configurePreviewServer proxies
#      and the Cesium bundle all wire up correctly)
#   3. every `*.test.mjs` under src/ passes
#
# We do NOT build the Docker image here — building the image only
# confirms the Dockerfile parses, which `docker build` does locally
# in seconds. The interesting question for CI is "does the source
# tree still build and pass tests after my change?" — that's what
# this workflow answers.

name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build (vite build)
        run: npm run build

      - name: Run unit tests
        # --test-concurrency=1 avoids a deadlock in the upstream test
        # harness where worker-spawned promises stay pending at exit.
        # See the comment at the top of this file for details.
        run: node --test --test-concurrency=1 'src/**/*.test.mjs'

      - name: Upload build artifact (dist/)
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7